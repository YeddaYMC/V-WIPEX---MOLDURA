<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Câmera #V_Wipex - IFPR Pinhais</title>
    <!-- Fonte -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Container Principal -->
    <div class="app-container">
        
        <!-- Topo UI -->
        <header class="header">
            <h1 class="title">Câmera #V_Wipex</h1>
            <p class="subtitle">IFPR Campus Pinhais</p>
        </header>

        <!-- Seletor de Estilos de Moldura -->
        <div class="preset-selector">
            <button class="btn-preset active" data-preset="cyber">1. Cyber Tech</button>
            <button class="btn-preset" data-preset="presenter">2. Apresentador</button>
            <button class="btn-preset" data-preset="smooth">3. Filtro Pele + Glow</button>
        </div>

        <!-- Viewport da Câmera -->
        <div class="camera-viewport" id="viewport">
            <!-- Vídeo Câmera -->
            <video id="webcam" autoplay playsinline class="video-feed"></video>
            
            <!-- Imagem Galeria -->
            <img id="user-image" class="user-image-feed" alt="Foto importada" style="display: none;">

            <!-- Overlay SVG Dinâmico -->
            <div class="frame-overlay" id="svg-frame">
                <svg viewBox="0 0 1080 1920" class="svg-element" id="svg-element">
                    <defs>
                        <!-- Gradiente Neon -->
                        <linearGradient id="neon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#4ade80" />
                            <stop offset="50%" stop-color="#22c55e" />
                            <stop offset="100%" stop-color="#06b6d4" />
                        </linearGradient>
                        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                            <feGaussianBlur stdDeviation="8" result="blur" />
                            <feComposite in="SourceGraphic" in2="blur" operator="over" />
                        </filter>
                    </defs>

                    <!-- O conteudo do SVG é gerado via script.js de acordo com a aba selecionada -->
                </svg>
            </div>

            <!-- Imagem Moldura Customizada PNG -->
            <img id="custom-frame-img" class="custom-frame-overlay" alt="Moldura personalizada" style="display: none;">
        </div>

        <!-- Painel Controles -->
        <div class="controls-panel">
            <div class="button-group">
                <button id="btn-capture" class="btn btn-primary">📸 Tirar Foto</button>
                <button id="btn-switch" class="btn btn-secondary">🔄 Inverter Câmera</button>
            </div>

            <div class="button-group">
                <label for="upload-photo" class="btn btn-outline">
                    🖼️ Foto da Galeria
                    <input type="file" id="upload-photo" accept="image/*" class="file-input">
                </label>
                
                <label for="upload-frame" class="btn btn-outline">
                    🎨 Trocar PNG
                    <input type="file" id="upload-frame" accept="image/png" class="file-input">
                </label>
            </div>
        </div>

        <!-- Canvas Escondido Processamento -->
        <canvas id="export-canvas" width="1080" height="1920" style="display: none;"></canvas>

        <!-- Modal Prévia -->
        <div id="preview-modal" class="modal" style="display: none;">
            <div class="modal-content">
                <h2 class="modal-title">Sua foto ficou incrível! 🎉</h2>
                <p class="modal-desc">Baixe e compartilhe no Instagram/LinkedIn com as hashtags <strong>#V_Wipex #IFPRPINHAIS</strong></p>
                <div class="preview-container">
                    <img id="preview-image" alt="Prévia da foto">
                </div>
                <div class="modal-actions">
                    <a id="btn-download" class="btn btn-primary" download="foto-v-wipex-ifpr.png">⬇️ Baixar Foto PNG</a>
                    <button id="btn-close-modal" class="btn btn-secondary">🔄 Tirar Outra</button>
                </div>
            </div>
        </div>

    </div>

    <!-- JS Principal -->
    <script src="script.js"></script>
</body>
</html>
