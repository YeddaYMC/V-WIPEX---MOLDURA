<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Câmera #V_WIPEX - IFPR Pinhais</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Tela Inicial de Permissão de Câmera -->
    <div id="permission-screen" class="permission-overlay">
        <div class="permission-card">
            <div class="icon-header">📸</div>
            <h2>Câmera #V_WIPEX</h2>
            <p>Para usar os filtros que preparamos para você acesse a sua câmera.</p>
            <button id="btn-grant-permission" class="btn btn-primary btn-large">
                OK
            </button>
            <p class="permission-hint">Clique acima e selecione <strong>"Permitir"</strong> no aviso do seu navegador.</p>
        </div>
    </div>

    <!-- App Viewport -->
    <div class="app-viewport">
        
        <!-- UI Superior (Título + 3 Filtros) -->
        <div class="top-ui">
            <header class="header">
                <h1 class="title">Câmera #V_WIPEX</h1>
                <p class="subtitle">IFPR Campus Pinhais</p>
            </header>

            <div class="preset-selector">
                <button class="btn-preset active" data-preset="clean">1. Clean & Lift</button>
                <button class="btn-preset" data-preset="cyber">2. Cyberpunk</button>
                <button class="btn-preset" data-preset="futuristic">3. Futurista</button>
            </div>
        </div>

        <!-- Camada da Câmera -->
        <div class="camera-layer" id="viewport">
            <video id="webcam" autoplay playsinline class="video-feed"></video>
            <img id="user-image" class="user-image-feed" alt="Foto importada" style="display: none;">
            
            <div class="frame-overlay" id="svg-frame">
                <svg viewBox="0 0 1080 1920" class="svg-element" id="svg-element" preserveAspectRatio="xMidYMid slice"></svg>
            </div>
            <img id="custom-frame-img" class="custom-frame-overlay" alt="Moldura personalizada" style="display: none;">
        </div>

        <!-- UI Inferior -->
        <div class="bottom-ui">
            <div class="button-group">
                <button id="btn-capture" class="btn btn-primary">📸 Tirar Foto</button>
                <button id="btn-switch" class="btn btn-secondary">🔄 Inverter</button>
            </div>

            <div class="button-group">
                <label for="upload-photo" class="btn btn-outline">
                    🖼️ Galeria
                    <input type="file" id="upload-photo" accept="image/*" class="file-input">
                </label>
                
                <label for="upload-frame" class="btn btn-outline">
                    🎨 Trocar PNG
                    <input type="file" id="upload-frame" accept="image/png" class="file-input">
                </label>
            </div>
        </div>

        <canvas id="export-canvas" width="1080" height="1920" style="display: none;"></canvas>

        <!-- Modal Prévia -->
        <div id="preview-modal" class="modal" style="display: none;">
            <div class="modal-content">
                <h2 class="modal-title">Foto Pronta! 🎉</h2>
                <p class="modal-desc">Compartilhe marcando <strong>#ifpr.oficial #ifprpinhaisoficial #V_WIPEX</strong></p>
                <div class="preview-container">
                    <img id="preview-image" alt="Prévia da foto">
                </div>
                <div class="modal-actions">
                    <a id="btn-download" class="btn btn-primary" download="foto-v-wipex-ifpr.png">⬇️ Baixar Foto PNG</a>
                    <button id="btn-close-modal" class="btn btn-secondary">🔄 Outra Foto</button>
                </div>
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
