<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moldura #V_Wipex - IFPR Pinhais</title>
    <!-- Fonte -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Container Principal -->
    <div class="app-container">
        
        <!-- Topo UI -->
        <header class="header">
            <h1 class="title">Câmera #V_Wipex</h1>
            <p class="subtitle">IFPR Campus Pinhais</p>
        </header>

        <!-- Viewport da Câmera -->
        <div class="camera-viewport">
            <!-- Vídeo Câmera -->
            <video id="webcam" autoplay playsinline class="video-feed"></video>
            
            <!-- Imagem Galeria -->
            <img id="user-image" class="user-image-feed" alt="Foto importada" style="display: none;">

            <!-- Overlay SVG -->
            <div class="frame-overlay" id="svg-frame">
                <svg viewBox="0 0 1080 1920" class="svg-element">
                    <!-- Cantoneiras -->
                    <path d="M 60,180 L 60,60 L 180,60" stroke="#22c55e" stroke-width="12" fill="none" stroke-linecap="round" />
                    <path d="M 1020,180 L 1020,60 L 900,60" stroke="#22c55e" stroke-width="12" fill="none" stroke-linecap="round" />
                    <path d="M 60,1740 L 60,1860 L 180,1860" stroke="#22c55e" stroke-width="12" fill="none" stroke-linecap="round" />
                    <path d="M 1020,1740 L 1020,1860 L 900,1860" stroke="#22c55e" stroke-width="12" fill="none" stroke-linecap="round" />

                    <!-- Topo Header -->
                    <g transform="translate(540, 150)" text-anchor="middle">
                        <!-- Logo IFPR -->
                        <g transform="translate(-160, -25)">
                            <rect x="0" y="0" width="22" height="22" rx="4" fill="#22c55e" />
                            <rect x="28" y="0" width="22" height="22" rx="4" fill="#ef4444" />
                            <rect x="0" y="28" width="22" height="22" rx="4" fill="#22c55e" />
                            <rect x="28" y="28" width="22" height="22" rx="4" fill="#22c55e" />
                            <rect x="0" y="56" width="22" height="22" rx="4" fill="#22c55e" />
                            <rect x="28" y="56" width="22" height="22" rx="4" fill="#22c55e" />
                        </g>

                        <!-- Capelo -->
                        <g transform="translate(140, 0)">
                            <path d="M -40,-10 L 0,-28 L 40,-10 L 0,8 Z" fill="#15803d" />
                            <path d="M -22,-1 L -22,18 C -22,26 22,26 22,18 L 22,-1" fill="#166534" />
                            <path d="M 0,-10 L 28,8 L 28,24" stroke="#eab308" stroke-width="3" fill="none" />
                            <circle cx="28" cy="26" r="4" fill="#eab308" />
                        </g>

                        <!-- Texto Campus -->
                        <text y="75" fill="#ffffff" font-family="Inter, sans-serif" font-size="28" font-weight="700" letter-spacing="4">CAMPUS PINHAIS</text>
                    </g>

                    <!-- Rodapé Base -->
                    <g transform="translate(540, 1720)" text-anchor="middle">
                        <!-- Hashtags -->
                        <rect x="-320" y="-60" width="640" height="70" rx="35" fill="rgba(15, 23, 42, 0.85)" stroke="#22c55e" stroke-width="3" />
                        <text y="-14" fill="#ffffff" font-family="Inter, sans-serif" font-size="34" font-weight="900" letter-spacing="2">
                            <tspan fill="#4ade80">#V_Wipex</tspan>  <tspan fill="#ffffff">#IFPRPINHAIS</tspan>
                        </text>

                        <!-- Texto Footer -->
                        <text y="50" fill="#e2e8f0" font-family="Inter, sans-serif" font-size="22" font-weight="900" letter-spacing="3">Ensino • Pesquisa • Extensão</text>
                    </g>
                </svg>
            </div>

            <!-- Imagem Moldura Customizada -->
            <img id="custom-frame-img" class="custom-frame-overlay" alt="Moldura personalizada" style="display: none;">
        </div>

        <!-- Painel Controles -->
        <div class="controls-panel">
            <div class="button-group">
                <button id="btn-capture" class="btn btn-primary">Tirar Foto</button>
                <button id="btn-switch" class="btn btn-secondary">Inverter Câmera</button>
            </div>

            <div class="button-group">
                <label for="upload-photo" class="btn btn-outline">
                    Usar Foto da Galeria
                    <input type="file" id="upload-photo" accept="image/*" class="file-input">
                </label>
                
                <label for="upload-frame" class="btn btn-outline">
                    Trocar Moldura (PNG)
                    <input type="file" id="upload-frame" accept="image/png" class="file-input">
                </label>
            </div>
        </div>

        <!-- Canvas Escondido Processamento -->
        <canvas id="export-canvas" width="1080" height="1920" style="display: none;"></canvas>

        <!-- Modal Prévia -->
        <div id="preview-modal" class="modal" style="display: none;">
            <div class="modal-content">
                <h2 class="modal-title">Sua foto está pronta!</h2>
                <div class="preview-container">
                    <img id="preview-image" alt="Prévia da foto">
                </div>
                <div class="modal-actions">
                    <a id="btn-download" class="btn btn-primary" download="foto-v-wipex-ifpr.png">Baixar Foto PNG</a>
                    <button id="btn-close-modal" class="btn btn-secondary">Tirar Outra</button>
                </div>
            </div>
        </div>

    </div>

    <!-- JS Principal -->
    <script src="script.js"></script>
</body>
</html>
